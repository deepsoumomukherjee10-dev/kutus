<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>To My Favorite Human 🤍</title>

    <!-- Google Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating Hearts -->
    <div class="hearts"></div>

    <!-- Mountains -->
    <div class="mountains">

        <div class="mountain mountain1"></div>

        <div class="mountain mountain2"></div>

        <div class="mountain mountain3"></div>

    </div>

    <!-- Flowers -->
    <div class="flowers">
        🌸 🌼 🌷 🌺 🌻
    </div>

    <!-- Extras -->
    <div class="extras">
        🍫 ☁️ ✨ 🤍 🍩
    </div>

    <!-- Music -->
    <audio id="bgMusic"></audio>

    <!-- Music Button -->
    <button id="musicBtn">🎵</button>

    <!-- Main -->
    <div class="container">

        <!-- Hero -->
        <div class="hero">

            <h1>
                To My Favorite Human 🤍
            </h1>

            <p>
                Somewhere between bestfriend and something more,
                you became one of the safest places in my life.
            </p>

        </div>

        <!-- Cards -->
        <div class="cards">

            <button class="card"
                data-title="When You're Sad 💔"
                data-message="Hey idiot, bad days don’t get to decide your worth. You’re still the same amazing person who makes everyone around them feel lighter. And if things get too heavy, I’m here. Always.">

                Open when you're sad

            </button>

            <button class="card"
                data-title="When You Miss Me 🌙"
                data-message="If you miss me, just remember there’s someone out there randomly smiling at dumb memories of you at 2AM. Apart from this you know how to reach him or how to get him...">

                Open when you miss me

            </button>

            <button class="card"
                data-title="When You're Angry 🌧️"
                data-message="Okay first of all... breathe. Second of all, don’t go starting world wars before drinking water. Remember lpg cylinder lagbe.....">

                Open when you're angry

            </button>

            <button class="card"
                data-title="When You Can't Sleep ✨"
                data-message="Imagine us sitting somewhere cold and quiet in the hills, talking nonsense while the world stays silent for a while. Jalate hole ekta phone call ;))))))">

                Open when you can't sleep

            </button>

            <button class="card"
                data-title="When You Need Motivation 🚀"
                data-message="You’ve already survived days you thought would break you. Don’t underestimate yourself now.Abr bole boshis na j 'Eito real philospher hoy gechis tor thake adivce na nile life chole' :))))))))">

                Open when you need motivation

            </button>

            <button class="card"
                data-title="When You Want To Smile 😊"
                data-message="Its unfair how one smile from you can feel like comfort, chaos, friendship and love all at once. Really dangerously unfair hahahahaha ">

                Open when you want to smile

            </button>

            <button class="card"
                data-title="When You're Overthinking 🌸"
                data-message="Your brain creates problems faster than reality sometimes. Relax a little okay? Not everything is falling apart. Eka overthink korle ektu share kore dish amr sathe:))))))))">

                Open when you're overthinking

            </button>

            <button class="card"
                data-title="Secret Message 🤍"
                data-message="Somehow you became my bestfriend, favorite human, safe place, and favorite headache all at once.">

                Open the secret message

            </button>

        </div>

        <!-- Final Button -->
        <div class="finalSection">

            <button class="finalBtn"
                    id="finalBtn">

                One More Thing...

            </button>

        </div>

    </div>

    <!-- Popup -->
    <div class="popup"
         id="popup">

        <div class="popup-content">

            <span class="close-btn"
                  id="closeBtn">

                &times;

            </span>

            <h2 id="popupTitle"></h2>

            <p id="popupMessage"></p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
